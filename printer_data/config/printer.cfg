# This file contains common pin mappings for the BIGTREETECH SKR V1.4 Turbo
# board. To use this config, the firmware should be compiled for the
# LPC1769.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[exclude_object]

[mcu]
serial: /dev/serial/by-id/usb-Fysetc_lpc1768_03900008291D29AFE564A35AC72000F5-if00

#[mcu Thermex]
#serial: /dev/serial/by-id/usb-Thermex_Thermistor_Expansion_540023000D51353239333638-if00


[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 13000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 15.0

[bed_screws]
screw1: 44, 65
screw2: 44, 235
screw3: 216, 235
screw4: 213, 65

[stepper_x]
step_pin: P0.4
dir_pin: !P0.5
enable_pin: !P4.28
microsteps: 16
rotation_distance: 40
endstop_pin: P1.29
position_endstop: -12
position_max: 238
position_min: -12
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: P2.6
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: P2.1
dir_pin: !P2.2
enable_pin: !P2.0
microsteps: 16
rotation_distance: 40
endstop_pin: P1.27
position_endstop: -33
position_max: 209
position_min: -33
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: P1.23
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: P0.20
dir_pin: P0.21
enable_pin: !P0.19
microsteps: 16
rotation_distance: 8
endstop_pin: P1.25
#position_endstop: 0.0
position_max: 250
position_min: -1

[tmc2209 stepper_z]
uart_pin: P2.11
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#[stepper_z1]
#step_pin: P0.1
#dir_pin: P0.0
#enable_pin: !P0.10
#position_endstop: 0.5
#position_max: 200

[safe_z_home]
home_xy_position:0, 0
#   A X, Y coordinate (e.g. 100, 100) where the Z homing should be
#   performed. This parameter must be provided.
speed: 50.0
#   Speed at which the toolhead is moved to the safe Z home
#   coordinate. The default is 50 mm/s
z_hop: 5
#   Distance (in mm) to lift the Z axis prior to homing. This is
#   applied to any homing command, even if it doesn't home the Z axis.
#   If the Z axis is already homed and the current Z position is less
#   than z_hop, then this will lift the head to a height of z_hop. If
#   the Z axis is not already homed the head is lifted by z_hop.
#   The default is to not implement Z hop.
#z_hop_speed: 15.0
#   Speed (in mm/s) at which the Z axis is lifted prior to homing. The
#   default is 15 mm/s.
move_to_previous: False

[extruder]
step_pin: P0.11
dir_pin: P2.13
enable_pin: !P2.12
microsteps: 16
rotation_distance: 2.8518327429228
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 5
max_temp: 280
min_extrude_temp: 20

[heater_fan hotend_fan]
pin: P2.3
heater: extruder
cycle_time: 0.0001 #10KHz PWM frecvency
heater_temp: 50
fan_speed: 1.0 # can be lowered to reduce fan noise
hardware_pwm: false
shutdown_speed: 0.0
max_power: 1.0 # can be lowered to reduce fan noise

[tmc2209 extruder]
uart_pin: P1.31
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.23
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 5
max_temp: 130

[fan]
pin: P2.4

[input_shaper]
shaper_freq_x: 27.5
#   A frequency (in Hz) of the input shaper for X axis. This is
#   usually a resonance frequency of X axis that the input shaper
#   should suppress. For more complex shapers, like 2- and 3-hump EI
#   input shapers, this parameter can be set from different
#   considerations. The default value is 0, which disables input
#   shaping for X axis.
shaper_freq_y: 27.5
#   A frequency (in Hz) of the input shaper for Y axis. This is
#   usually a resonance frequency of Y axis that the input shaper
#   should suppress. For more complex shapers, like 2- and 3-hump EI
#   input shapers, this parameter can be set from different
#   considerations. The default value is 0, which disables input
#   shaping for Y axis.
#shaper_freq_z: 0
#   A frequency (in Hz) of the input shaper for Z axis. The default
#   value is 0, which disables input shaping for Z axis.
#shaper_type: mzv
#   A type of the input shaper to use for all axes. Supported
#   shapers are zv, mzv, zvd, ei, 2hump_ei, and 3hump_ei. Some shapers
#   support optional additional parameters, e.g. mzv(n=4,t=0.9) or
#   ei(v_tol=0.1). The default is mzv input shaper (without parameters).
#shaper_type_x:
#shaper_type_y:
#shaper_type_z:
#   If shaper_type is not set, these parameters can be used to
#   configure different input shapers for X, Y, and Z axes. The same
#   values are supported as for shaper_type parameter.
#damping_ratio_x: 0.1
#damping_ratio_y: 0.1
#damping_ratio_z: 0.1
#   Damping ratios of vibrations of X and Y axes used by input shapers
#   to improve vibration suppression. Default value is 0.1 which is a
#   good all-round value for most printers. In most circumstances this
#   parameter requires no tuning and should not be changed.


[include Config_Backup.cfg]

[auto_speed]

[gcode_macro screws_adjust]
gcode:
 BED_SCREWS_ADJUST

[gcode_macro Z_Calibrate]
gcode:
  Z_ENDSTOP_CALIBRATE


